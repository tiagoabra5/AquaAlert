; PlatformIO - AquaAlert (NUCLEO-L476RG + X-NUCLEO-S2915A1)
; Projeto "bare-metal": usa o HAL, CMSIS, startup e linker script do proprio
; repositorio (mesma configuracao do projeto STM32CubeIDE em .cproject).

[platformio]
src_dir = .
include_dir = Inc
default_envs = node1

[env]
platform = ststm32
board = nucleo_l476rg
; O linker script do CubeIDE usa "(READONLY)", que exige GCC >= 11
platform_packages = toolchain-gccarmnoneeabi@~1.120301.0
; sem "framework": o HAL/CMSIS vem das pastas Drivers/ e CMSIS/

board_build.ldscript = STM32L476RGTX_FLASH.ld

build_src_filter =
    +<Src/*.c>
    +<Startup/*.s>
    +<Drivers/STM32L4xx_HAL_Driver/Src/*.c>
    +<Drivers/BSP/STM32L4xx_Nucleo/*.c>
    +<Drivers/BSP/X-NUCLEO-S2868A1/Src/*.c>
    +<Drivers/BSP/Components/S2LP/S2LP_Library/Src/*.c>
    +<Drivers/BSP/Components/S2LP/S2LP_Util/Src/*.c>

build_flags =
    -DDEBUG
    -DSTM32
    -DSTM32L4
    -DSTM32L476RGTx
    -DSTM32L476xx
    -DUSE_STM32L4XX_NUCLEO
    -DX_NUCLEO_S2915A1
    -IInc
    -ICMSIS/Include
    -ICMSIS/Device/ST/STM32L4xx/Include
    -IDrivers/STM32L4xx_HAL_Driver/Inc
    -IDrivers/BSP/STM32L4xx_Nucleo
    -IDrivers/BSP/X-NUCLEO-S2868A1/Inc
    -IDrivers/BSP/Components/S2LP/S2LP_Library/Inc
    -IDrivers/BSP/Components/S2LP/S2LP_Util/Inc
    -std=gnu11
    -g3
    -ffunction-sections
    -fdata-sections
    -Wall

extra_scripts = pre:pio_fpu.py

upload_protocol = stlink
debug_tool = stlink
; O firmware nao usa UART/printf: o diagnostico e feito pelo LD2 e por
; variaveis globais observadas no depurador (pio debug / F5 no VS Code).

; Uma env por placa (NODE_ID diferente em cada no da rede)
[env:node1]
build_flags = ${env.build_flags} -DNODE_ID=1

[env:node2]
build_flags = ${env.build_flags} -DNODE_ID=2
